[package]
name = "gg-compute"
description = "GPU Goblin approved compute catalog and Burn adapters (CPU Flex; optional WGPU/Vulkan)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# WGPU/Vulkan backend. Requires an explicitly selected device; never falls back to CPU silently.
gpu = ["burn/wgpu", "burn/vulkan", "dep:wgpu", "dep:pollster", "dep:cubecl-runtime"]
# Native CUDA engine: LibTorch with PyTorch's autograd (needs LibTorch 2.9.0 at build and run time).
cuda = ["burn/tch", "dep:tch"]

[dependencies]
gg-core = { path = "../gg-core" }
gg-protocol = { path = "../gg-protocol" }
burn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Same major as cubecl-wgpu 0.10 (wgpu 29); only used to name adapter types under `gpu`.
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
# The version Burn 0.21 uses; only to place the kernel compilation cache (ADR-0032).
cubecl-runtime = { version = "=0.10.0", optional = true }
# The version burn-tch 0.21 binds (LibTorch 2.9.0).
tch = { version = "=0.22.0", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
